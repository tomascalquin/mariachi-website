<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel de administración</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Panel de administración</h1>
      <p class="sub">Ingresa tus datos para gestionar reservas, testimonios y la galería.</p>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="boton boton-primario">Ingresar</button>
        <div class="aviso error" id="aviso-login" hidden></div>
      </form>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
